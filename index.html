async function saveDocToFolder(text, patient, dateIso) {
  if (!dirHandle) return false;
  try {
    const ds = dateIso ? new Date(dateIso).toLocaleDateString("fr-FR").replace(/\//g,"-") : new Date().toLocaleDateString("fr-FR").replace(/\//g,"-");
    const fname = (patient ? patient.replace(/\s+/g,"_") : "CR") + "_" + ds + ".doc";
    const html = buildWordHtml(text, fname);
    const blob = new Blob(["\ufeff", html], { type:"application/msword" });
    const fileHandle = await dirHandle.getFileHandle(fname, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return fname;
  } catch(e) {
    console.error("Erreur écriture fichier:", e);
    return false;
  }
}

Type : ${tpl.name}

${tpl.sections.map((s,i)=>`\n${i+1}. ${s}`).join("")}

}
async function submitTranscription(url,piiRedaction=false){

  const body={

    diarization:true,

    language_config:{languages:["fr"],code_switching:false},
    // Vocabulaire médical et diététique pour améliorer la précision
    custom_vocabulary:true,
    custom_vocabulary_config:{
      vocabulary:[
        "IMC","IRC","HbA1c","DFG","kaliémie","phosphatémie","albuminémie",
        "sarcopénie","dénutrition","dyslipidémie","stéatose hépatique","SAOS",
        "bypass gastrique","sleeve gastrectomie","anneau gastrique",
        "diurèse","créatinine","bicarbonates","urée","RCIU","albuminurie",

        "HTA","AOMI","NASH","SOPK","hypothyroïdie","insulinorésistance",
        "diététicien","nutritionniste","diétothérapie","protéinurie"
      ],

    },

}
function pollTranscript(result_url){
  return new Promise((res,rej)=>{const go=async()=>{try{const r=await fetch("/api/gladia-poll",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({result_url})});const d=await r.json();if(d.status==="done")res(d);else if(d.status==="error")rej(new Error(d.result?.error||"Erreur Gladia"));else setTimeout(go,3500);}catch(e){rej(e);}};go();});
}
// Normalize Gladia utterances → structured array with timestamps + confidence
function formatTranscriptStructured(data){
  const utterances=data.result?.transcription?.utterances;
  const fullText=data.result?.transcription?.full_transcript||"";
  if(!utterances||!utterances.length){
    return [{speaker:"A",text:fullText,startMs:0,endMs:0,avgConfidence:null,words:[]}];
  }
  const speakerMap={};let idx=0;
  const letters=["A","B","C","D","E"];
  return utterances.map(u=>{
    const spk=u.speaker;
    if(!(spk in speakerMap))speakerMap[spk]=letters[idx++]||String(spk);
    const words=(u.words||[]).map(w=>({
      text:w.word||w.text||"",
      startMs:Math.round((w.start||0)*1000),
      endMs:Math.round((w.end||0)*1000),
      confidence:w.confidence??null
    }));
    const confs=words.filter(w=>w.confidence!==null).map(w=>w.confidence);
    const avgConfidence=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:null;
    // If utterance text is empty, rebuild from words
    const text=u.text||u.transcript||(words.map(w=>w.text).join(" ").trim())||"";
    return {
      speaker:speakerMap[spk],
      text,
      startMs:Math.round((u.start||0)*1000),
      endMs:Math.round((u.end||0)*1000),
      avgConfidence,
      words
    };
  }).filter(u=>u.text.trim());
}
// Plain text for Claude prompt — fallback to full_transcript if all utterances empty
function utterancesToPlain(utterances,rawText){
  const plain=utterances.map(u=>`Locuteur ${u.speaker} : ${u.text}`).join("\n");
  return plain.trim()||rawText||"";
}
// ms → MM:SS
const fmtMs=ms=>{const s=Math.floor((ms||0)/1000);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;};
// Acoustic reliability per utterance
function analyzeAcousticReliability(utterances){
  return utterances.map(u=>{
    if(u.avgConfidence===null)return "grey";
    if(u.avgConfidence>=0.85)return "green";
    if(u.avgConfidence>=0.65)return "orange";
    return "red";
  });
}
// Textual reliability via Claude
async function analyzeTextualReliability(utterances){
  const tx=utterances.map((u,i)=>`[${i}] Locuteur ${u.speaker} : ${u.text}`).join("\n");
  const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1000,system:`Tu es expert en transcription médicale. Analyse cette transcription de consultation diététique. Identifie les passages textuellement incohérents ou suspects.\nRéponds UNIQUEMENT en JSON valide, format exact : {"flags":[{"index":N,"level":"warning"|"error","reason":"explication courte en français"}]}\n- "error" : valeur médicale impossible (glycémie 0.4, IMC 85...), terme médical clairement déformé, phrase brisée\n- "warning" : valeur atypique, attribution de locuteur suspecte, terme ambigu\nSi aucune incohérence : {"flags":[]}`,messages:[{role:"user",content:`Transcription :\n${tx}`}]})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  try{const clean=d.content[0].text.replace(/```json|```/g,"").trim();return JSON.parse(clean).flags||[];}catch{return [];}
}
// Export transcript as Markdown
function exportTranscriptMD(utterances,acousticFlags,textualFlags,patient,tplName,date){
  const ds=new Date(date).toLocaleDateString("fr-FR");
  const flagMap={};(textualFlags||[]).forEach(f=>flagMap[f.index]=f);
  let md=`# Transcription — ${patient||"Patient anonyme"}\n**Type :** ${tplName}  \n**Date :** ${ds}  \n\n---\n\n`;
  utterances.forEach((u,i)=>{
    const acFlag=acousticFlags?acousticFlags[i]:null;
    const txFlag=flagMap[i];
    const badge=txFlag?.level==="error"?"🔴":txFlag?.level==="warning"?"🟠":acFlag==="red"?"🔴":acFlag==="orange"?"🟠":acFlag==="green"?"🟢":"";
    md+=`**[${fmtMs(u.startMs)}] Locuteur ${u.speaker}** ${badge}  \n${u.text}  \n`;
    if(txFlag)md+=`> ⚠️ *${txFlag.reason}*  \n`;
    if(acFlag&&acFlag!=="green"&&u.avgConfidence!==null)md+=`> 📊 *Fiabilité acoustique : ${Math.round(u.avgConfidence*100)}%*  \n`;
    md+="\n";
  });
  const errors=(textualFlags||[]).filter(f=>f.level==="error").length;
  const warnings=(textualFlags||[]).filter(f=>f.level==="warning").length;
  const lowAc=(acousticFlags||[]).filter(f=>f==="red"||f==="orange").length;
  md+=`---\n\n## Résumé\n- 🔴 Erreurs textuelles : ${errors}\n- 🟠 Avertissements : ${warnings}\n- 📊 Passages acoustiquement faibles : ${lowAc}\n`;
  const blob=new Blob([md],{type:"text/markdown"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=(patient?patient.replace(/\s+/g,"_"):"CR")+"_transcription_"+ds.replace(/\//g,"-")+".md";a.click();
}

async function reviewCR(cr,utterances){
  const tx=utterances.map(u=>`[${fmtMs(u.startMs)}] Locuteur ${u.speaker} : ${u.text}`).join("\n");
  const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-5",max_tokens:4000,system:`Tu es un expert en rédaction de comptes rendus médicaux. Tu dois relire un compte rendu diététique et le comparer à la transcription originale de la consultation.

Identifie précisément :
1. Les OMISSIONS : informations importantes dites dans la consultation mais absentes du CR
2. Les CONTRADICTIONS : le CR affirme quelque chose de différent de ce qui est dit
3. Les REFORMULATIONS suggérées : passages du CR à améliorer pour plus de précision

Réponds UNIQUEMENT en JSON valide, sans markdown, sans preamble :
{
  "omissions": [{"timestamp":"MM:SS","transcrit":"ce qui a été dit","impact":"haut|moyen|bas"}],
  "contradictions": [{"dans_cr":"formulation du CR","dans_transcript":"ce qui a vraiment été dit"}],
  "suggestions": [{"original":"passage du CR","ameliore":"version améliorée","raison":"explication courte"}],
  "points_confirmes": N,
  "avis_global": "phrase courte d'appréciation globale"
}
Si catégorie vide : tableau vide []. Sois rigoureux mais non sur-interprétatif : une synthèse professionnelle n'est pas une omission.`,messages:[{role:"user",content:`TRANSCRIPTION ORIGINALE :\n${tx}\n\n---\n\nCOMPTE RENDU GÉNÉRÉ :\n${cr}`}]})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  try{const clean=d.content[0].text.replace(/```json|```/g,"").trim();return JSON.parse(clean);}
  catch{throw new Error("Réponse malformée de Claude");}
}

async function generateCR(transcript,tpl,patient){
  const r=await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-5",max_tokens:4000,system:buildPrompt(tpl,patient),messages:[{role:"user",content:`Transcription :\n\n${transcript}\n\nRédige le compte rendu structuré.`}]})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);return d.content[0].text;
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function toHtml(text){
  return text.split("\n").map(raw=>{
    if(!raw.trim())return "<br/>";
    let l=raw.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
    if(l.match(/^\d+\.\s+[A-ZÀ-Ùa-zà-ù]/))return `<h2>${l}</h2>`;
    return `<p>${l}</p>`;
  }).join("");
}

function buildWordHtml(text, fname) {
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${fname}</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;margin:2.5cm 2cm;color:#1a1a1a}h2{font-size:11pt;font-weight:bold;color:#0B2D59;margin-top:14pt;margin-bottom:3pt;text-transform:uppercase;border-bottom:1px solid #E2E8F0;padding-bottom:2pt}p{margin:3pt 0;line-height:1.5}strong{font-weight:600}</style></head><body>${toHtml(text)}</body></html>`;
}

function downloadWord(text, patient, dateIso) {
  const ds = dateIso ? new Date(dateIso).toLocaleDateString("fr-FR").replace(/\//g,"-") : new Date().toLocaleDateString("fr-FR").replace(/\//g,"-");
  const fn = (patient?patient.replace(/\s+/g,"_"):"CR")+"_"+ds+".doc";
  const blob = new Blob(["\ufeff", buildWordHtml(text, fn)], {type:"application/msword"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click();
}

function exportPDF(text) {
  const w=window.open("","_blank");if(!w){alert("Autorisez les popups");return;}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"><style>@page{margin:2.5cm 2cm}body{font-family:'DM Sans',Arial,sans-serif;font-size:10.5pt;color:#1a1a1a}h2{font-size:10.5pt;font-weight:700;color:#0B2D59;margin-top:14pt;text-transform:uppercase;border-bottom:1px solid #CBD5E1;padding-bottom:2pt}p{margin:3pt 0;line-height:1.55}</style></head><body>${toHtml(text)}<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);
  w.document.close();
}

// ─── JSON BACKUP ──────────────────────────────────────────────────────────────
function exportJSON(customTpls) {
  const data = {
    version: 1,
    exportDate: new Date().toISOString(),
    records: loadRecords(),
    customTemplates: customTpls.filter(t=>t.custom),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ScriviA_sauvegarde_"+new Date().toLocaleDateString("fr-FR").replace(/\//g,"-")+".json";
  a.click();
}

function importJSON(file, onSuccess) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.version || !Array.isArray(data.records)) throw new Error("Format invalide");
      const existing = loadRecords();
      const existingIds = new Set(existing.map(r=>r.id));
      const newRecs = data.records.filter(r=>!existingIds.has(r.id));
      saveRecords([...newRecs, ...existing]);
      onSuccess(data.customTemplates||[], newRecs.length, data.records.length - newRecs.length);
    } catch(err) {
      alert("Erreur d'import : "+err.message);
    }
  };
  reader.readAsText(file);
}

// ─── RECORDING ────────────────────────────────────────────────────────────────
function RecPage({tpl,patient,recording,isPaused,recTime,audioLv,audioBlob,micTest,onTestMic,bitrate,setBitrate,onStart,onStop,onPause,onResume,onProcess,onBack}){
  const [bars,setBars]=useState(Array(28).fill(6));
  const [lowSignal,setLowSignal]=useState(false);
  const lowStreakRef=useRef(0);
  useEffect(()=>{
    if((!recording||isPaused)&&micTest!=="testing"){if(!recording)setBars(Array(28).fill(6));setLowSignal(false);lowStreakRef.current=0;return;}
    const id=setInterval(()=>{
      setBars(prev=>prev.map((_,i)=>{const base=Math.max(0,1-Math.abs(i-13.5)/14);return Math.max(4,base*audioLv*0.85+Math.random()*10+5);}));
      if(recording&&!isPaused){
        if(audioLv<9){lowStreakRef.current+=1;}else{lowStreakRef.current=0;}
        setLowSignal(lowStreakRef.current>50);
      }
    },80);
    return()=>clearInterval(id);
  },[recording,isPaused,micTest,audioLv]);
  return <div style={{minHeight:"100vh",background:S.bg,display:"flex",flexDirection:"column"}}>
    <Header title="Enregistrement" onBack={onBack} sub={tpl?.name+(patient?" — "+patient:"")}/>

        <div style={{fontWeight:700,color:S.navy,fontFamily:"'DM Serif Display',serif",fontSize:16}}>{tpl?.name}</div>
        {patient&&<div style={{fontSize:13,color:S.muted,marginTop:3}}>{patient}</div>}
      </Card>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:68,fontWeight:700,lineHeight:1,fontFamily:"monospace",color:recording?S.navy:audioBlob?"#16A34A":"#CBD5E1"}}>{fmtTime(recTime)}</div>
        <div style={{fontSize:12,color:S.muted,marginTop:3}}>max 45:00{recording?` · ${bitrate/1000}kbps`:""}</div>
        <div style={{width:180,height:4,borderRadius:999,background:S.light,overflow:"hidden",margin:"9px auto 0"}}>
          <div style={{height:"100%",borderRadius:999,width:`${Math.min(100,(recTime/2700)*100)}%`,background:recording?S.teal:audioBlob?"#22C55E":S.light,transition:"width 1s linear"}}/>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:72}}>
        {bars.map((h,i)=><div key={i} style={{width:6,height:Math.max(4,Math.min(68,h)),borderRadius:999,background:recording?S.teal:micTest==="testing"?S.teal:audioBlob?"#22C55E":"#CBD5E1",transition:"height 0.07s ease"}}/>)}

      <div style={{display:"flex",alignItems:"center",gap:8,fontSize:14,fontWeight:600,color:isPaused?"#D97706":recording?"#EF4444":audioBlob?"#16A34A":S.muted}}>
        {recording&&!isPaused&&<span className="pulse">●</span>}
        {isPaused?"⏸ En pause":recording?"Enregistrement en cours…":audioBlob?"✓ Terminé":"Appuyez pour démarrer"}
      </div>
      {recording&&!isPaused&&lowSignal&&<div style={{display:"flex",alignItems:"center",gap:8,background:"#FEF3C7",border:"1.5px solid #FCD34D",borderRadius:12,padding:"9px 14px",maxWidth:310}}>
        <span style={{fontSize:18}}>🔇</span>
        <span style={{fontSize:12,color:"#92400E",fontWeight:600}}>Son faible détecté — rapprochez-vous du micro ou parlez plus fort</span>
      </div>}
      <div style={{width:"100%",maxWidth:290,display:"flex",flexDirection:"column",gap:11}}>
        {!recording&&!audioBlob&&<>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,padding:"9px 12px",borderRadius:12,border:`1.5px solid ${S.border}`,background:S.white}}>
            <span style={{fontSize:12,fontWeight:600,color:S.muted}}>🎚️ Qualité audio</span>

// ─── TRANSCRIPT VIEWER ────────────────────────────────────────────────────────
function TranscriptViewer({utterances,patient,tplName,date}){
  const [acousticFlags,setAcousticFlags]=useState(null);
  const [textualFlags,setTextualFlags]=useState(null);
  const [loadingTx,setLoadingTx]=useState(false);
  const [txErr,setTxErr]=useState(null);
  const flagColors={green:"#22C55E",orange:"#F59E0B",red:"#EF4444",grey:"#CBD5E1"};

  const runAcoustic=()=>setAcousticFlags(analyzeAcousticReliability(utterances));
  const runTextual=async()=>{
    setLoadingTx(true);setTxErr(null);
    try{const flags=await analyzeTextualReliability(utterances);setTextualFlags(flags);}
    catch(e){setTxErr(e.message);}
    setLoadingTx(false);
  };
  const flagMap=useMemo(()=>{const m={};(textualFlags||[]).forEach(f=>m[f.index]=f);return m;},[textualFlags]);
  const globalScore=useMemo(()=>{
    if(!acousticFlags&&!textualFlags)return null;
    const total=utterances?.length||0;if(!total)return null;
    let issues=0;
    if(acousticFlags)issues+=acousticFlags.filter(f=>f==="red").length*2+acousticFlags.filter(f=>f==="orange").length;
    if(textualFlags)issues+=(textualFlags.filter(f=>f.level==="error").length*3+textualFlags.filter(f=>f.level==="warning").length);
    return Math.max(0,Math.round(100-(issues/total)*15));
  },[acousticFlags,textualFlags,utterances]);

  if(!utterances||!utterances.length)return <div style={{padding:16,textAlign:"center",color:S.muted,fontSize:13}}>Pas de transcription disponible</div>;

  return <div style={{display:"flex",flexDirection:"column",gap:10,padding:"12px 16px"}}>
    {/* Toolbar */}
    <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
      <button onClick={runAcoustic} style={{padding:"7px 11px",borderRadius:10,border:`1.5px solid ${acousticFlags?"#86EFAC":S.border}`,background:acousticFlags?"#F0FDF4":S.white,color:acousticFlags?"#15803D":S.text,fontWeight:600,fontSize:12,cursor:"pointer"}}>
        📊 {acousticFlags?"Acoustique ✓":"Analyse acoustique"}
      </button>
      <button onClick={runTextual} disabled={loadingTx} style={{padding:"7px 11px",borderRadius:10,border:`1.5px solid ${textualFlags?"#86EFAC":S.border}`,background:textualFlags?"#F0FDF4":S.white,color:textualFlags?"#15803D":S.text,fontWeight:600,fontSize:12,cursor:loadingTx?"not-allowed":"pointer"}}>
        {loadingTx?"⏳ Analyse…":textualFlags?"🧠 Textuel ✓":"🧠 Analyse textuelle (IA)"}
      </button>
      <button onClick={()=>exportTranscriptMD(utterances,acousticFlags,textualFlags,patient,tplName,date)} style={{padding:"7px 11px",borderRadius:10,border:`1.5px solid ${S.teal}`,background:"transparent",color:S.teal,fontWeight:600,fontSize:12,cursor:"pointer"}}>
        💾 Sauvegarder .md
      </button>
    </div>
    {txErr&&<div style={{padding:"8px 12px",borderRadius:10,background:"#FEF2F2",border:"1px solid #FECACA",fontSize:12,color:"#DC2626"}}>Erreur : {txErr}</div>}
    {/* Score global */}
    {globalScore!==null&&<div style={{padding:"10px 14px",borderRadius:12,display:"flex",alignItems:"center",gap:12,background:globalScore>=85?"#F0FDF4":globalScore>=65?"#FFFBEB":"#FEF2F2",border:`1.5px solid ${globalScore>=85?"#86EFAC":globalScore>=65?"#FCD34D":"#FECACA"}`}}>
      <div style={{fontSize:26,fontWeight:700,color:globalScore>=85?"#15803D":globalScore>=65?"#92400E":"#DC2626"}}>{globalScore}%</div>
      <div><div style={{fontSize:13,fontWeight:600,color:globalScore>=85?"#15803D":globalScore>=65?"#92400E":"#DC2626"}}>Fiabilité estimée</div><div style={{fontSize:11,color:S.muted}}>{acousticFlags?"acoustique ":""}{textualFlags?"textuelle ":""}analysé</div></div>
    </div>}
    {/* Utterances */}
    {utterances.map((u,i)=>{
      const acFlag=acousticFlags?acousticFlags[i]:null;
      const txFlag=flagMap[i];
      const borderColor=txFlag?.level==="error"?"#FECACA":txFlag?.level==="warning"?"#FCD34D":acFlag==="red"?"#FECACA":acFlag==="orange"?"#FDE68A":S.border;
      const bgColor=txFlag?.level==="error"?"#FEF2F2":txFlag?.level==="warning"?"#FFFBEB":acFlag==="red"?"#FEF2F2":acFlag==="orange"?"#FFFBEB":S.white;
      return <div key={i} style={{borderRadius:12,padding:"10px 12px",border:`1.5px solid ${borderColor}`,background:bgColor}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
          <span style={{fontSize:11,color:S.muted,fontFamily:"monospace",flexShrink:0}}>[{fmtMs(u.startMs)}]</span>
          <span style={{fontSize:12,fontWeight:700,color:S.navy,flexShrink:0}}>Locuteur {u.speaker}</span>
          {acFlag&&acFlag!=="grey"&&<span style={{width:8,height:8,borderRadius:"50%",background:flagColors[acFlag],flexShrink:0,display:"inline-block"}} title={u.avgConfidence!==null?`Confiance : ${Math.round(u.avgConfidence*100)}%`:""}/>}
          {txFlag&&<span style={{fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:999,background:txFlag.level==="error"?"#FEF2F2":"#FFFBEB",color:txFlag.level==="error"?"#DC2626":"#92400E"}}>{txFlag.level==="error"?"ERREUR":"ATTENTION"}</span>}
        </div>
        <p style={{fontSize:13,color:S.text,lineHeight:1.6,margin:0}}>{u.text}</p>
        {txFlag&&<p style={{fontSize:11,color:txFlag.level==="error"?"#DC2626":"#92400E",marginTop:4,fontStyle:"italic"}}>⚠️ {txFlag.reason}</p>}
        {acFlag&&acFlag!=="green"&&u.avgConfidence!==null&&<p style={{fontSize:11,color:S.muted,marginTop:2}}>📊 Confiance acoustique : {Math.round(u.avgConfidence*100)}%</p>}
      </div>;
    })}
    {/* Légende */}
    {(acousticFlags||textualFlags)&&<div style={{display:"flex",gap:12,flexWrap:"wrap",paddingTop:4}}>
      {acousticFlags&&<><span style={{fontSize:11,color:S.muted,display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:"#22C55E",display:"inline-block"}}/>Acoustique fiable</span><span style={{fontSize:11,color:S.muted,display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:"#F59E0B",display:"inline-block"}}/>Moyenne</span><span style={{fontSize:11,color:S.muted,display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:"#EF4444",display:"inline-block"}}/>Faible</span></>}
      {textualFlags&&<><span style={{fontSize:11,color:"#92400E"}}>🟠 Avertissement</span><span style={{fontSize:11,color:"#DC2626"}}>🔴 Erreur textuelle</span></>}
    </div>}
  </div>;
}

// ─── MODAL CONFIRMATION APPLICATION ──────────────────────────────────────────
function ActionModal({type,item,cr,onConfirm,onCancel}){
  const initText=()=>{
    if(type==="suggestion")return item.ameliore||"";
    if(type==="omission")return item.transcrit||"";
    if(type==="contradiction")return item.dans_transcript||"";
    return "";
  };
  const [text,setText]=useState(initText);
  const cfg={
    suggestion:{title:"Appliquer la suggestion",color:"#1D4ED8",bg:"#EFF6FF",btnLabel:"✅ Remplacer dans le CR"},
    omission:{title:"Ajouter l'information manquante",color:"#DC2626",bg:"#FEF2F2",btnLabel:"✅ Ajouter en fin de CR"},
    contradiction:{title:"Corriger la contradiction",color:"#92400E",bg:"#FFFBEB",btnLabel:"✅ Remplacer dans le CR"},
  }[type];
  const handleConfirm=()=>{
    let next=cr;
    if(type==="suggestion"){
      next=cr.includes(item.original)?cr.replace(item.original,text):cr+`\n\n[Reformulation suggérée : ${text}]`;
    }else if(type==="omission"){
      next=cr+`\n\n[Information ajoutée — ${item.timestamp}] ${text}`;
    }else if(type==="contradiction"){
      next=cr.includes(item.dans_cr)?cr.replace(item.dans_cr,text):cr+`\n\n[Correction : ${text}]`;
    }
    onConfirm(next);
  };
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onCancel}>
    <div onClick={e=>e.stopPropagation()} style={{background:S.white,borderRadius:20,padding:22,width:"100%",maxWidth:480,boxShadow:"0 8px 40px rgba(0,0,0,0.22)"}}>
      <div style={{fontWeight:700,fontSize:16,color:S.navy,marginBottom:14,fontFamily:"'DM Serif Display',serif"}}>{cfg.title}</div>
      {type==="suggestion"&&<div style={{marginBottom:12,padding:"9px 13px",borderRadius:11,background:"#F8FAFC",fontSize:12,color:S.muted,fontStyle:"italic",lineHeight:1.5}}>Passage actuel : "{item.original}"</div>}
      {type==="contradiction"&&<>
        <div style={{fontSize:12,color:"#92400E",fontWeight:600,marginBottom:4}}>Passage à corriger dans le CR :</div>
        <div style={{marginBottom:10,padding:"9px 13px",borderRadius:11,background:"#FFFBEB",fontSize:12,color:S.text,fontStyle:"italic",lineHeight:1.5}}>"{item.dans_cr}"</div>
        <div style={{fontSize:12,color:"#15803D",fontWeight:600,marginBottom:4}}>Ce qui a été dit :</div>
        <div style={{marginBottom:12,padding:"9px 13px",borderRadius:11,background:"#F0FDF4",fontSize:12,color:S.text,lineHeight:1.5}}>"{item.dans_transcript}"</div>
      </>}
      {type==="omission"&&<div style={{marginBottom:12,padding:"9px 13px",borderRadius:11,background:"#FEF2F2",fontSize:12,color:S.text,lineHeight:1.5}}>⏱ {item.timestamp} — "{item.transcrit}"</div>}
      <div style={{fontSize:12,fontWeight:600,color:S.text,marginBottom:7}}>
        {type==="suggestion"?"Reformulation à appliquer :":type==="omission"?"Information à ajouter (éditez si nécessaire) :":"Correction à appliquer :"}
      </div>
      <textarea value={text} onChange={e=>setText(e.target.value)} rows={4}
        style={{width:"100%",border:`1.5px solid ${cfg.color}50`,borderRadius:12,padding:"10px 12px",fontSize:13,color:S.text,background:cfg.bg,resize:"vertical",outline:"none",lineHeight:1.6}}/>
      <div style={{fontSize:11,color:S.muted,marginTop:6,marginBottom:14,lineHeight:1.5}}>
        {type==="suggestion"&&"Le texte original sera remplacé par la reformulation ci-dessus."}
        {type==="omission"&&"L'information sera ajoutée à la fin du CR avec horodatage. Reformulez-la en style médical."}
        {type==="contradiction"&&"Le passage incohérent sera remplacé. Vérifiez la reformulation avant de valider."}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
        <button onClick={onCancel} style={{padding:"12px 0",borderRadius:12,border:"none",background:S.light,color:S.text,fontWeight:600,cursor:"pointer",fontSize:14}}>Annuler</button>
        <button onClick={handleConfirm} disabled={!text.trim()} style={{padding:"12px 0",borderRadius:12,border:"none",background:text.trim()?cfg.color:S.light,color:text.trim()?"#fff":S.muted,fontWeight:700,cursor:text.trim()?"pointer":"not-allowed",fontSize:14}}>{cfg.btnLabel}</button>
      </div>
    </div>
  </div>;
}

function CollapsibleSection({title,count,color,bgColor,borderColor,defaultOpen=true,children}){

      <span style={{fontWeight:700,fontSize:13,color}}>{title}</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11,fontWeight:700,padding:"1px 8px",borderRadius:999,background:color,color:"#fff"}}>{count}</span>

}

                    <div style={{flex:1}}>
                      <div style={{fontSize:11,color:"#92400E",fontWeight:600,marginBottom:2}}>Dans le CR :</div>
                      <p style={{fontSize:12,color:S.text,margin:"0 0 5px",lineHeight:1.5,fontStyle:"italic"}}>"{c.dans_cr}"</p>
                      <div style={{fontSize:11,color:"#15803D",fontWeight:600,marginBottom:2}}>Dans la transcription :</div>
                      <p style={{fontSize:12,color:S.text,margin:0,lineHeight:1.5}}>"{c.dans_transcript}"</p>
                    </div>
                    {done
                      ?<span style={{fontSize:11,fontWeight:700,color:"#15803D",flexShrink:0}}>✅ Corrigé</span>
                      :<button onClick={()=>setAction({type:"contradiction",item:c,key})} style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:7,border:"1.5px solid #92400E",background:"#fff",color:"#92400E",cursor:"pointer",flexShrink:0}}>Corriger</button>
                    }
                  </div>
                </div>;
              })}
            </CollapsibleSection>}

          {/* Suggestions */}
          {review.suggestions?.length>0&&
            <CollapsibleSection title="💡 Suggestions de reformulation" count={review.suggestions.length} color="#1D4ED8" bgColor="#EFF6FF">
              {review.suggestions.map((s,i)=>{
                const key=`suggestion_${i}`;
                const done=applied.has(key);
                return <div key={i} style={{padding:"10px 12px",borderRadius:10,background:done?"#F0FDF4":"#EFF6FF",border:"1px solid #BFDBFE20",opacity:done?0.6:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,color:"#64748B",fontWeight:500,marginBottom:3,fontStyle:"italic"}}>Actuel : "{s.original}"</div>
                      <div style={{fontSize:13,color:"#1D4ED8",fontWeight:600,marginBottom:3}}>→ {s.ameliore}</div>
                      <div style={{fontSize:11,color:S.muted}}>{s.raison}</div>
                    </div>
                    {done
                      ?<span style={{fontSize:11,fontWeight:700,color:"#15803D",flexShrink:0}}>✅ Appliqué</span>
                      :<button onClick={()=>setAction({type:"suggestion",item:s,key})} style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:7,border:"1.5px solid #1D4ED8",background:"#fff",color:"#1D4ED8",cursor:"pointer",flexShrink:0}}>Appliquer</button>
                    }
                  </div>
                </div>;
              })}
            </CollapsibleSection>}

          {total===0&&!review.suggestions?.length&&<div style={{textAlign:"center",padding:"24px 0"}}>
            <div style={{fontSize:32,marginBottom:8}}>🎉</div>
            <div style={{fontWeight:700,color:"#15803D",fontSize:15}}>Aucun problème détecté</div>
            <div style={{fontSize:13,color:S.muted,marginTop:4}}>Le CR est cohérent avec la transcription.</div>
          </div>}
        </div>
      </div>
    </div>

    {/* Modal confirmation */}
    {action&&<ActionModal
      type={action.type}
      item={action.item}
      cr={cr}
      onConfirm={newCr=>handleApply(newCr,action.key)}
      onCancel={()=>setAction(null)}
    />}
  </>;
}

function EditPage({cr,setCr,utterances,patient,tpl,onExport,onBack}){
  const [tab,setTab]=useState("cr");
  const [f,setF]=useState(false);
  const [reviewing,setReviewing]=useState(false);
  const [reviewResult,setReviewResult]=useState(null);
  const [reviewErr,setReviewErr]=useState(null);
  const [showReview,setShowReview]=useState(false);

  const runReview=async()=>{
    if(!cr.trim()||!utterances?.length)return;
    setReviewing(true);setReviewErr(null);
    try{const r=await reviewCR(cr,utterances);setReviewResult(r);setShowReview(true);}
    catch(e){setReviewErr(e.message);}
    setReviewing(false);
  };

  const hasIssues=reviewResult&&((reviewResult.omissions?.length||0)+(reviewResult.contradictions?.length||0))>0;

  return <div style={{minHeight:"100vh",background:S.bg,display:"flex",flexDirection:"column"}}>
    <Header title="Relecture & correction" onBack={onBack} sub={tpl?.name+(patient?" — "+patient:"")}/>
    {/* Tabs */}
    <div style={{display:"flex",background:S.white,borderBottom:`1px solid ${S.border}`,flexShrink:0}}>
      <button onClick={()=>setTab("cr")} style={{flex:1,padding:"10px 0",border:"none",background:"none",fontWeight:700,fontSize:13,color:tab==="cr"?S.navy:S.muted,borderBottom:`3px solid ${tab==="cr"?S.navy:"transparent"}`,cursor:"pointer"}}>📄 Compte rendu</button>
      <button onClick={()=>setTab("transcript")} style={{flex:1,padding:"10px 0",border:"none",background:"none",fontWeight:700,fontSize:13,color:tab==="transcript"?S.navy:S.muted,borderBottom:`3px solid ${tab==="transcript"?S.navy:"transparent"}`,cursor:"pointer"}}>🎙️ Transcription</button>
    </div>
    {tab==="cr"&&<>
      {/* Toolbar CR */}
      <div style={{padding:"8px 16px",background:S.white,borderBottom:`1px solid ${S.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexShrink:0}}>
        <span style={{fontSize:11,color:S.muted}}>{cr.length} caractères</span>
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          {reviewResult&&<button onClick={()=>setShowReview(true)} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",borderRadius:9,border:`1.5px solid ${hasIssues?"#FECACA":"#86EFAC"}`,background:hasIssues?"#FEF2F2":"#F0FDF4",color:hasIssues?"#DC2626":"#15803D",fontWeight:700,fontSize:11,cursor:"pointer"}}>
            {hasIssues?`⚠️ ${(reviewResult.omissions?.length||0)+(reviewResult.contradictions?.length||0)} problème(s)`:"✅ Relu"} — voir
          </button>}
          <button onClick={runReview} disabled={reviewing||!utterances?.length} style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:9,border:`1.5px solid ${S.teal}`,background:reviewing?"#F8FAFC":S.white,color:reviewing?S.muted:S.teal,fontWeight:700,fontSize:12,cursor:(!utterances?.length||reviewing)?"not-allowed":"pointer",opacity:!utterances?.length?0.5:1}}>
            {reviewing?<><span className="spin" style={{fontSize:12}}>⚙️</span> Relecture…</>:"🔍 Relecture IA"}
          </button>
        </div>
      </div>
      {reviewErr&&<div style={{margin:"8px 16px 0",padding:"8px 12px",borderRadius:10,background:"#FEF2F2",border:"1px solid #FECACA",fontSize:12,color:"#DC2626",flexShrink:0}}>Erreur relecture : {reviewErr}</div>}
      <div style={{flex:1,padding:"11px 16px 7px",display:"flex",flexDirection:"column",minHeight:0}}>
        <textarea value={cr} onChange={e=>setCr(e.target.value)}
          style={{flex:1,width:"100%",borderRadius:16,padding:15,fontSize:14,border:`1.5px solid ${f?S.teal:S.border}`,background:S.white,color:S.text,lineHeight:1.7,resize:"none",outline:"none",minHeight:280}}
          onFocus={()=>setF(true)} onBlur={()=>setF(false)} placeholder="Le compte rendu apparaîtra ici…"/>
      </div>
      <div style={{padding:"10px 16px 20px",flexShrink:0}}>
        <button onClick={onExport} disabled={!cr.trim()} style={{width:"100%",padding:"14px 0",borderRadius:16,border:"none",background:cr.trim()?S.navy:S.light,color:cr.trim()?"#fff":S.muted,fontWeight:700,fontSize:16,cursor:cr.trim()?"pointer":"not-allowed"}}>
          💾 Enregistrer & Exporter
        </button>
      </div>
    </>}
    {tab==="transcript"&&<div style={{flex:1,overflowY:"auto",paddingBottom:20}}>
      <TranscriptViewer utterances={utterances} patient={patient} tplName={tpl?.name||""} date={new Date().toISOString()}/>
    </div>}
    {/* Modal relecture */}
    {showReview&&reviewResult&&<ReviewPanel review={reviewResult} cr={cr} onApply={setCr} onClose={()=>setShowReview(false)}/>}
  </div>;
}

      </div>
      <p style={{fontSize:11,textAlign:"center",color:S.muted}}>Le CR est aussi accessible dans <strong>Dossiers patients</strong>.</p>
    </div>

}

// ─── HISTORY ──────────────────────────────────────────────────────────────────
function HistoryPage({onBack,onOpenRecord}){
  const [records,setRecords]=useState(loadRecords);
  const [search,setSearch]=useState("");
  const grouped=useMemo(()=>{
    const q=search.toLowerCase().trim();
    const filtered=q?records.filter(r=>(r.patient||"").toLowerCase().includes(q)||(r.tplName||"").toLowerCase().includes(q)):records;
    const map={};
    filtered.forEach(r=>{const k=r.patient||"— Anonyme —";if(!map[k])map[k]=[];map[k].push(r);});
    return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],"fr"));
  },[records,search]);
  const del=id=>{if(!window.confirm("Supprimer ce compte rendu ?"))return;const u=records.filter(r=>r.id!==id);saveRecords(u);setRecords(u);};
  return <div style={{minHeight:"100vh",background:S.bg,display:"flex",flexDirection:"column"}}>
    <Header title="Dossiers patients" onBack={onBack}/>
    <div style={{padding:"11px 16px",background:S.white,borderBottom:`1px solid ${S.border}`,flexShrink:0}}>
      <FInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher un patient ou un type…"/>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 40px",maxWidth:600,margin:"0 auto",width:"100%"}}>
      {records.length===0&&<div style={{textAlign:"center",padding:"56px 20px"}}>
        <div style={{fontSize:44,marginBottom:10}}>📂</div>
        <p style={{fontWeight:600,color:S.text,fontSize:15}}>Aucun dossier enregistré</p>
        <p style={{fontSize:13,color:S.muted,marginTop:5}}>Les CR générés apparaîtront ici après sauvegarde</p>
      </div>}
      {grouped.length===0&&records.length>0&&<div style={{textAlign:"center",padding:"36px 20px"}}><p style={{fontSize:14,color:S.muted}}>Aucun résultat pour « {search} »</p></div>}
      {grouped.map(([patientName,recs])=>(
        <div key={patientName} style={{marginBottom:22}} className="fadein">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:9}}>
            <div style={{width:34,height:34,borderRadius:11,background:S.navy,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:14,flexShrink:0}}>{patientName[0].toUpperCase()}</div>
            <div><div style={{fontWeight:700,color:S.text,fontFamily:"'DM Serif Display',serif",fontSize:16}}>{patientName}</div><div style={{fontSize:12,color:S.muted}}>{recs.length} consultation{recs.length>1?"s":""}</div></div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:7,paddingLeft:44}}>
            {recs.map(r=>(
              <div key={r.id} style={{background:S.white,border:`1.5px solid ${S.border}`,borderRadius:14,padding:"11px 13px",display:"flex",alignItems:"center",gap:11}}>
                <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>onOpenRecord(r)}>
                  <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:3}}><Badge cat={r.cat||"Général"}/><span style={{fontSize:12,color:S.muted}}>{fmtDateShort(r.date)}</span></div>
                  <div style={{fontSize:13,fontWeight:600,color:S.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.tplName}</div>
                  <div style={{fontSize:11,color:S.muted,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.cr.slice(0,75)}…</div>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                  <button onClick={()=>downloadWord(r.cr,r.patient,r.date)} style={{padding:"5px 10px",borderRadius:8,border:"none",background:"#EFF6FF",color:"#1D4ED8",fontWeight:700,fontSize:12,cursor:"pointer"}}>📝 Word</button>
                  <button onClick={()=>del(r.id)} style={{padding:"5px 10px",borderRadius:8,border:"none",background:"#FEF2F2",color:"#DC2626",fontWeight:700,fontSize:12,cursor:"pointer"}}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  </div>;
}

// ─── RECORD DETAIL ────────────────────────────────────────────────────────────
function RecordDetail({record,onBack}){
  const [cr,setCr]=useState(record.cr);
  const [edited,setEdited]=useState(false);
  const [saved,setSaved]=useState(false);
  const [f,setF]=useState(false);
  const [tab,setTab]=useState("cr");
  const change=v=>{setCr(v);setEdited(true);setSaved(false);};
  const save=()=>{const recs=loadRecords();const i=recs.findIndex(r=>r.id===record.id);if(i>=0){recs[i]={...recs[i],cr};saveRecords(recs);}setSaved(true);setEdited(false);};
  return <div style={{minHeight:"100vh",background:S.bg,display:"flex",flexDirection:"column"}}>
    <Header title={record.patient||"Anonyme"} onBack={onBack} sub={record.tplName+" · "+fmtDate(record.date)}/>
    <div style={{display:"flex",background:S.white,borderBottom:`1px solid ${S.border}`,flexShrink:0}}>
      <button onClick={()=>setTab("cr")} style={{flex:1,padding:"10px 0",border:"none",background:"none",fontWeight:700,fontSize:13,color:tab==="cr"?S.navy:S.muted,borderBottom:`3px solid ${tab==="cr"?S.navy:"transparent"}`,cursor:"pointer"}}>📄 Compte rendu</button>
      <button onClick={()=>setTab("transcript")} style={{flex:1,padding:"10px 0",border:"none",background:"none",fontWeight:700,fontSize:13,color:tab==="transcript"?S.navy:S.muted,borderBottom:`3px solid ${tab==="transcript"?S.navy:"transparent"}`,cursor:"pointer",opacity:record.utterances?.length?1:0.4}}>🎙️ Transcription</button>
    </div>
    {tab==="cr"&&<>
      <div style={{padding:"6px 16px",background:S.white,borderBottom:`1px solid ${S.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",gap:7,alignItems:"center"}}><Badge cat={record.cat||"Général"}/><span style={{fontSize:11,color:S.muted}}>{cr.length} car.</span></div>
        {edited&&<button onClick={save} style={{fontSize:12,fontWeight:700,padding:"5px 11px",borderRadius:8,border:"none",background:"#DCFCE7",color:"#15803D",cursor:"pointer"}}>💾 Sauvegarder</button>}
        {saved&&!edited&&<span style={{fontSize:12,color:"#15803D",fontWeight:600}}>✓ Sauvegardé</span>}
      </div>
      <div style={{flex:1,padding:"11px 16px 7px",display:"flex",flexDirection:"column",minHeight:0}}>
        <textarea value={cr} onChange={e=>change(e.target.value)}
          style={{flex:1,width:"100%",borderRadius:16,padding:15,fontSize:14,border:`1.5px solid ${f?S.teal:S.border}`,background:S.white,color:S.text,lineHeight:1.7,resize:"none",outline:"none",minHeight:280}}
          onFocus={()=>setF(true)} onBlur={()=>setF(false)}/>
      </div>
      <div style={{padding:"10px 16px 20px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,flexShrink:0}}>
        <button onClick={()=>downloadWord(cr,record.patient,record.date)} style={{padding:"13px 0",borderRadius:14,border:"none",background:S.navy,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>📝 Word</button>
        <button onClick={()=>exportPDF(cr)} style={{padding:"13px 0",borderRadius:14,border:"none",background:"#DC2626",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>📋 PDF</button>
      </div>
    </>}
    {tab==="transcript"&&<div style={{flex:1,overflowY:"auto",paddingBottom:20}}>
      {record.utterances?.length
        ? <TranscriptViewer utterances={record.utterances} patient={record.patient} tplName={record.tplName} date={record.date}/>
        : <div style={{padding:24,textAlign:"center",color:S.muted,fontSize:13}}>Transcription non disponible pour ce CR (généré avant la v5)</div>}
    </div>}
  </div>;
}

// ─── TEMPLATES PAGE ───────────────────────────────────────────────────────────
function TplsPage({allTpls,onSave,onBack}){
  const [creating,setCreating]=useState(false);
  const [nm,setNm]=useState("");const [cat,setCat]=useState("Personnalisé");const [secs,setSecs]=useState("");
  const create=()=>{if(!nm.trim()||!secs.trim())return;const sections=secs.split("\n").map(s=>s.trim()).filter(Boolean);if(!sections.length)return;onSave([...allTpls,{id:"c-"+Date.now(),name:nm.trim(),cat,custom:true,sections}]);setNm("");setSecs("");setCreating(false);};
  const del=id=>{if(window.confirm("Supprimer cette trame ?"))onSave(allTpls.filter(t=>t.id!==id));};
  return <div style={{minHeight:"100vh",background:S.bg,display:"flex",flexDirection:"column"}}>
    <Header title="Gérer les trames" onBack={onBack}/>
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 40px",maxWidth:600,margin:"0 auto",width:"100%"}}>
      {allTpls.map(t=><Card key={t.id} style={{marginBottom:11}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
          <div><div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:5}}><Badge cat={t.cat}/>{t.custom&&<span style={{fontSize:11,fontStyle:"italic",color:S.muted}}>Personnalisé</span>}</div><div style={{fontWeight:700,color:S.text,fontFamily:"'DM Serif Display',serif",fontSize:15}}>{t.name}</div></div>
          {t.custom&&<button onClick={()=>del(t.id)} style={{fontSize:11,fontWeight:700,padding:"4px 9px",borderRadius:8,border:"none",background:"#FEF2F2",color:"#DC2626",cursor:"pointer",flexShrink:0}}>Supprimer</button>}
        </div>
        <div style={{marginTop:7}}>{t.sections.map((s,i)=><div key={i} style={{display:"flex",gap:7,fontSize:12,color:S.muted,marginBottom:1}}><span style={{color:"#CBD5E1",minWidth:16}}>{i+1}.</span>{s}</div>)}</div>
      </Card>)}
      {!creating
        ?<button onClick={()=>setCreating(true)} style={{width:"100%",padding:"15px 0",borderRadius:16,border:`2px dashed ${S.teal}`,background:"transparent",color:S.teal,fontWeight:600,fontSize:15,cursor:"pointer"}}>+ Créer une trame personnalisée</button>
        :<Card>
          <div style={{fontWeight:700,color:S.navy,fontFamily:"'DM Serif Display',serif",fontSize:16,marginBottom:13}}>Nouvelle trame</div>
          <FInput value={nm} onChange={e=>setNm(e.target.value)} placeholder="Ex : Suivi post-chirurgie bariatrique" style={{marginBottom:10}}/>
          <select value={cat} onChange={e=>setCat(e.target.value)} style={{width:"100%",border:`1.5px solid ${S.border}`,borderRadius:12,padding:"10px 12px",fontSize:14,color:S.text,background:S.white,outline:"none",marginBottom:10}}>{Object.keys(CAT).map(c=><option key={c}>{c}</option>)}</select>
          <label style={{fontSize:13,fontWeight:600,color:S.text,display:"block",marginBottom:5}}>Sections <span style={{fontWeight:400,color:S.muted}}>(une par ligne)</span></label>
          <FInput value={secs} onChange={e=>setSecs(e.target.value)} placeholder={"MOTIF DE CONSULTATION\nANAMNÈSE\n…"} rows={7}/>
          <p style={{fontSize:11,color:S.muted,marginTop:4,marginBottom:12}}>{secs.split("\n").filter(s=>s.trim()).length} sections</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
            <button onClick={()=>setCreating(false)} style={{padding:"12px 0",borderRadius:12,border:"none",background:S.light,color:S.text,fontWeight:600,cursor:"pointer"}}>Annuler</button>
            <button onClick={create} disabled={!nm.trim()||!secs.trim()} style={{padding:"12px 0",borderRadius:12,border:"none",background:nm.trim()&&secs.trim()?S.navy:S.light,color:nm.trim()&&secs.trim()?"#fff":S.muted,fontWeight:600,cursor:nm.trim()&&secs.trim()?"pointer":"not-allowed"}}>Créer</button>
          </div>
        </Card>}
    </div>
  </div>;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState("home");
  const [allTpls,setAllTpls]=useState(()=>{try{const s=localStorage.getItem(TK);return s?[...TEMPLATES,...JSON.parse(s)]:[...TEMPLATES];}catch{return[...TEMPLATES];}});
  const [tpl,setTpl]=useState(null);
  const [patient,setPatient]=useState("");
  const [folderName,setFolderName]=useState(()=>{try{return localStorage.getItem(FK)||"";}catch{return "";}});
  const [piiRedaction,setPiiRedaction]=useState(()=>{try{return localStorage.getItem(PK)==="true";}catch{return false;}});
  const [bitrate,setBitrate]=useState(()=>{try{return parseInt(localStorage.getItem(BK))||128000;}catch{return 128000;}});
  useEffect(()=>{try{localStorage.setItem(BK,String(bitrate));}catch{}},[bitrate]);

  const [recording,setRecording]=useState(false);
  const [isPaused,setIsPaused]=useState(false);
  const [recTime,setRecTime]=useState(0);
  const [audioBlob,setAudioBlob]=useState(null);
  const [audioLv,setAudioLv]=useState(0);
  const [pLog,setPLog]=useState([]);
  const [pErr,setPErr]=useState(null);
  const [utterances,setUtterances]=useState([]); // structured utterances with timestamps
  const [rawTx,setRawTx]=useState("");
  const [cr,setCr]=useState("");
  const [savedRec,setSavedRec]=useState(null);
  const [savedFileName,setSavedFileName]=useState(null);
  const [currentRec,setCurrentRec]=useState(null);

  const mrRef=useRef(null),streamRef=useRef(null),timerRef=useRef(null),analyserRef=useRef(null),animRef=useRef(null),ctxRef=useRef(null),recTimeRef=useRef(0);

  useEffect(()=>{try{localStorage.setItem(PK,String(piiRedaction));}catch{}},[piiRedaction]);
  const saveCustom=tpls=>{try{localStorage.setItem(TK,JSON.stringify(tpls.filter(t=>t.custom)));}catch{}setAllTpls(tpls);};

  const handlePickFolder=async()=>{
    try{
      const name=await pickFolder();
      if(name){setFolderName(name);localStorage.setItem(FK,name);}
    }catch(e){alert("Impossible d'accéder au dossier : "+e.message);}
  };

  const [micTest,setMicTest]=useState(null); // null | "testing" | "ok" | "low"
  const testMic=async()=>{
    setMicTest("testing");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      const ctx=new AudioContext();
      const src=ctx.createMediaStreamSource(stream);
      const an=ctx.createAnalyser();an.fftSize=256;src.connect(an);
      let peak=0,frames=0,anim;
      const tick=()=>{const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);const lv=d.reduce((a,b)=>a+b,0)/d.length;setAudioLv(lv);peak=Math.max(peak,lv);frames++;anim=requestAnimationFrame(tick);};
      tick();
      setTimeout(()=>{
        cancelAnimationFrame(anim);
        stream.getTracks().forEach(t=>t.stop());
        ctx.close();
        setAudioLv(0);
        setMicTest(peak>=18?"ok":"low");
      },5000);
    }catch(e){setMicTest(null);alert("Microphone inaccessible : "+e.message);}
  };
  const startRec=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      streamRef.current=stream;
      const ctx=new AudioContext();ctxRef.current=ctx;
      const src=ctx.createMediaStreamSource(stream);
      const an=ctx.createAnalyser();an.fftSize=256;src.connect(an);analyserRef.current=an;
      const tick=()=>{if(!analyserRef.current)return;const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);setAudioLv(d.reduce((a,b)=>a+b,0)/d.length);animRef.current=requestAnimationFrame(tick);};tick();
      const mime=["audio/webm","audio/ogg","audio/mp4",""].find(m=>!m||MediaRecorder.isTypeSupported(m));
      const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:bitrate}:{audioBitsPerSecond:bitrate});mrRef.current=mr;
      const chunks=[];
      mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      mr.onstop=()=>{setAudioBlob(new Blob(chunks,{type:mime||"audio/webm"}));setRecording(false);};
      mr.start(1000);
      recTimeRef.current=0;setRecording(true);setIsPaused(false);setAudioBlob(null);setRecTime(0);
      timerRef.current=setInterval(()=>{recTimeRef.current+=1;setRecTime(recTimeRef.current);if(recTimeRef.current>=2700)stopRec();},1000);
    }catch(e){alert("Microphone inaccessible : "+e.message);}
  };
  const pauseRec=()=>{
    if(mrRef.current&&mrRef.current.state==="recording"){
      mrRef.current.pause();
      clearInterval(timerRef.current);
      cancelAnimationFrame(animRef.current);
      setAudioLv(0);
      setIsPaused(true);
    }
  };
  const resumeRec=()=>{
    if(mrRef.current&&mrRef.current.state==="paused"){
      mrRef.current.resume();
      const an=analyserRef.current;
      const tick=()=>{if(!analyserRef.current)return;const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);setAudioLv(d.reduce((a,b)=>a+b,0)/d.length);animRef.current=requestAnimationFrame(tick);};tick();
      timerRef.current=setInterval(()=>{recTimeRef.current+=1;setRecTime(recTimeRef.current);if(recTimeRef.current>=2700)stopRec();},1000);
      setIsPaused(false);
    }
  };
  const stopRec=()=>{
    clearInterval(timerRef.current);cancelAnimationFrame(animRef.current);analyserRef.current=null;
    if(ctxRef.current){ctxRef.current.close();ctxRef.current=null;}
    streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());
    if(mrRef.current&&mrRef.current.state!=="inactive")mrRef.current.stop();
    setAudioLv(0);setIsPaused(false);
  };
  const process=async()=>{
    if(!audioBlob)return;
    setPage("processing");setPLog([]);setPErr(null);
    const log=(m,s="prog")=>setPLog(p=>[...p,{m,s,t:new Date().toLocaleTimeString("fr-FR")}]);
    try{
      log("Envoi de l'audio vers Gladia…");
      const upl=await uploadAudio(audioBlob);
      log(`Audio envoyé ✓ (fichier local : ${(upl.blobSize/1024).toFixed(0)} Ko · reçu par Gladia : ${upl.size?(upl.size/1024).toFixed(0)+' Ko':'?'} · durée détectée : ${upl.duration?upl.duration.toFixed(1)+'s':'?'})`,"done");
      const url=upl.url;
      log("Transcription avec identification des locuteurs…");
      const {id,result_url}=await submitTranscription(url,piiRedaction);
      log("Transcription en cours…");
      const res=await pollTranscript(result_url);
      const utts=formatTranscriptStructured(res);
      setUtterances(utts);
      const tx=utterancesToPlain(utts,res.result?.transcription?.full_transcript||"");setRawTx(tx);
      log(`Transcription terminée — ${utts.length} répliques ✓`,"done");
      log("Génération du compte rendu avec Claude…");
      const result=await generateCR(tx,tpl,patient);setCr(result);
      log("Compte rendu généré ✓","done");
      setTimeout(()=>setPage("editing"),1200);
    }catch(e){const msg=e.message||"Erreur inconnue";log("Erreur : "+msg,"err");setPErr(msg);}
  };

  const handleSaveExport=async()=>{
    const now=new Date().toISOString();
    const rec={id:"rec-"+Date.now(),patient:patient||"",tplName:tpl?.name||"",cat:tpl?.cat||"Général",date:now,cr,rawTx,utterances};
    addRecord(rec);setSavedRec(rec);
    // Auto-save to folder if available
    const fname=await saveDocToFolder(cr,patient,now);
    setSavedFileName(fname||null);
    setPage("export");
  };

  const reset=()=>{setPage("home");setCr("");setRawTx("");setUtterances([]);setPatient("");setTpl(null);setAudioBlob(null);setRecTime(0);setPLog([]);setPErr(null);setSavedRec(null);setSavedFileName(null);recTimeRef.current=0;};

  const handleImport=(customTpls)=>{
    if(customTpls.length>0){
      const merged=[...TEMPLATES,...customTpls];
      try{localStorage.setItem(TK,JSON.stringify(customTpls));}catch{}
      setAllTpls(merged);
    }
  };

  return <div>
    {page==="home"       && <HomePage allTpls={allTpls} tpl={tpl} setTpl={setTpl} patient={patient} setPatient={setPatient} folderName={folderName} onPickFolder={handlePickFolder} onStart={()=>setPage("recording")} onTpls={()=>setPage("templates")} onHistory={()=>setPage("history")} onSettings={()=>setPage("settings")}/>}
    {page==="recording"  && <RecPage tpl={tpl} patient={patient} recording={recording} isPaused={isPaused} recTime={recTime} audioLv={audioLv} audioBlob={audioBlob} micTest={micTest} onTestMic={testMic} bitrate={bitrate} setBitrate={setBitrate} onStart={startRec} onStop={stopRec} onPause={pauseRec} onResume={resumeRec} onProcess={process} onBack={()=>setPage("home")}/>}
    {page==="processing" && <ProcPage log={pLog} err={pErr} onBack={reset} onRetry={process}/>}
    {page==="editing"    && <EditPage cr={cr} setCr={setCr} utterances={utterances} patient={patient} tpl={tpl} onExport={handleSaveExport} onBack={reset}/>}
    {page==="export"     && <ExportPage cr={cr} patient={patient} dateIso={savedRec?.date||new Date().toISOString()} tplName={tpl?.name||""} savedFileName={savedFileName} onBack={()=>setPage("editing")} onHome={reset}/>}
    {page==="history"    && <HistoryPage onBack={()=>setPage("home")} onOpenRecord={r=>{setCurrentRec(r);setPage("record");}}/>}
    {page==="record"     && currentRec && <RecordDetail record={currentRec} onBack={()=>setPage("history")}/>}
    {page==="templates"  && <TplsPage allTpls={allTpls} onSave={saveCustom} onBack={()=>setPage("home")}/>}
    {page==="settings"   && <SettingsPage allTpls={allTpls} folderName={folderName} onPickFolder={handlePickFolder} onBack={()=>setPage("home")} onImport={handleImport} piiRedaction={piiRedaction} onTogglePii={v=>setPiiRedaction(v)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js");
    });
  }
</script>
</body>
</html>
